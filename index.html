<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="game-layout" aria-label="테트리스 게임">
    <canvas id="game-board" width="300" height="600" aria-label="테트리스 게임 보드">
      게임 보드를 표시하려면 캔버스를 지원하는 브라우저가 필요합니다.
    </canvas>
    <aside class="score-panel" aria-labelledby="score-heading">
      <h1 id="score-heading">점수</h1>
      <p id="score">0</p>
      <p id="game-status" role="status" aria-live="polite"></p>
      <button id="restart-button" type="button">다시시작</button>
      <p class="controls">← → 이동<br>↑ 시계 방향 회전<br>↓ 빠른 낙하<br>Space 즉시 하강</p>
    </aside>
  </main>
</body>
</html>
